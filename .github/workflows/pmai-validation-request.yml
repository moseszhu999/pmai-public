name: PMAI validation request carrier

on:
  push:
    branches:
      - main
    paths:
      - validation-requests/current.json

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.request.outputs.status }}
      requestId: ${{ steps.request.outputs.requestId }}
      privateExactSha: ${{ steps.request.outputs.privateExactSha }}
      expectedBaseSha: ${{ steps.request.outputs.expectedBaseSha }}
      expectedChangedFileCount: ${{ steps.request.outputs.expectedChangedFileCount }}
      expectedMigrationCount: ${{ steps.request.outputs.expectedMigrationCount }}
      validationProfile: ${{ steps.request.outputs.validationProfile }}
    steps:
      - name: Check out public validation request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate public controller and request contracts
        run: |
          npm test
          npm run check

      - name: Parse fixed validation request
        id: request
        run: node scripts/read-validation-request.mjs

  validate:
    needs: prepare
    if: needs.prepare.outputs.status == 'PASS'
    uses: ./.github/workflows/pmai-exact-head-controller.yml
    with:
      privateExactSha: ${{ needs.prepare.outputs.privateExactSha }}
      expectedBaseSha: ${{ needs.prepare.outputs.expectedBaseSha }}
      expectedChangedFileCount: ${{ needs.prepare.outputs.expectedChangedFileCount }}
      expectedMigrationCount: ${{ needs.prepare.outputs.expectedMigrationCount }}
      validationProfile: ${{ needs.prepare.outputs.validationProfile }}
    secrets:
      PMAI_PRIVATE_READ_TOKEN: ${{ secrets.PMAI_PRIVATE_READ_TOKEN }}

  publish-sanitized-evidence:
    needs:
      - prepare
      - validate
    if: always() && needs.prepare.outputs.status == 'PASS'
    runs-on: ubuntu-24.04
    steps:
      - name: Comment sanitized evidence ledger
        uses: actions/github-script@v7
        env:
          REQUEST_ID: ${{ needs.prepare.outputs.requestId }}
          VALIDATION_PROFILE: ${{ needs.prepare.outputs.validationProfile }}
          PRIVATE_EXACT_SHA: ${{ needs.prepare.outputs.privateExactSha }}
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.expectedBaseSha }}
          FINAL_VERDICT: ${{ needs.validate.outputs.verdict }}
          FAILURE_STAGE: ${{ needs.validate.outputs.failureStage }}
        with:
          script: |
            const safe = (value, fallback) => value && value.length > 0 ? value : fallback;
            const body = [
              '## PMAI exact-head validation evidence',
              '',
              `- Request ID: \`${safe(process.env.REQUEST_ID, 'UNKNOWN')}\``,
              `- Validation profile: **${safe(process.env.VALIDATION_PROFILE, 'UNKNOWN')}**`,
              `- Exact private SHA: \`${safe(process.env.PRIVATE_EXACT_SHA, 'UNKNOWN')}\``,
              `- Exact expected base SHA: \`${safe(process.env.EXPECTED_BASE_SHA, 'UNKNOWN')}\``,
              `- Public workflow run ID: \`${context.runId}\``,
              `- Final verdict: **${safe(process.env.FINAL_VERDICT, 'FAIL')}**`,
              `- Failure stage: **${safe(process.env.FAILURE_STAGE, 'VALIDATION_JOB_NOT_RUN')}**`,
              '',
              'No private source, changed-file names, raw output, artifact, secret, deployment, or database action is included in this evidence.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 5,
              body,
            });
